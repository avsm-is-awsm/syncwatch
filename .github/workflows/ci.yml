name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t syncwatch .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name sw syncwatch
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/api/sync/run | python -c "import sys,json; r=json.load(sys.stdin); print(r['status'], r['records_synced']); assert r['records_synced'] > 0"
          docker logs sw | tail -20
